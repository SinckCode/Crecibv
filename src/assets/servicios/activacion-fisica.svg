<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="20" fill="#f3e5f5"/>
  <rect x="40" y="40" width="320" height="220" rx="16" fill="#ffffff" stroke="#7b1fa2" stroke-width="2"/>
  <!-- Person exercising -->
  <circle cx="200" cy="85" r="18" fill="#ef0381"/>
  <!-- Body -->
  <line x1="200" y1="103" x2="200" y2="160" stroke="#ef0381" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms raised -->
  <line x1="200" y1="125" x2="160" y2="100" stroke="#ef0381" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="125" x2="240" y2="100" stroke="#ef0381" stroke-width="5" stroke-linecap="round"/>
  <!-- Legs wide -->
  <line x1="200" y1="160" x2="165" y2="210" stroke="#ef0381" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="160" x2="235" y2="210" stroke="#ef0381" stroke-width="5" stroke-linecap="round"/>
  <!-- Energy lines -->
  <line x1="145" y1="88" x2="125" y2="78" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="255" y1="88" x2="275" y2="78" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="140" y1="105" x2="118" y2="105" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="260" y1="105" x2="282" y2="105" stroke="#7b1fa2" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Stars -->
  <circle cx="120" cy="140" r="5" fill="#ef0381" opacity="0.3"/>
  <circle cx="280" cy="140" r="5" fill="#ef0381" opacity="0.3"/>
  <circle cx="100" cy="170" r="3" fill="#7b1fa2" opacity="0.3"/>
  <circle cx="300" cy="170" r="3" fill="#7b1fa2" opacity="0.3"/>
  <!-- Heart rate line -->
  <path d="M100 230 L140 230 L155 215 L165 240 L175 210 L185 235 L195 220 L205 230 L300 230" stroke="#ef0381" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <text x="200" y="270" text-anchor="middle" font-family="Poppins, sans-serif" font-size="14" fill="#7b1fa2" font-weight="600">Activacion Fisica</text>
</svg>
